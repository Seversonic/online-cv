{% assign skills = site.data.data.skills %} {% if skills %}
<section class="skills-section section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-wrench fa-stack-1x fa-inverse"></i>
    </span>
    {{ skills.title }}
  </h2>

  <div class="skills-groups">
    {% for group in skills.groups %}
    <div class="skills-group">
      <h3>{{ group.name }}</h3>
      <p>{{ group.items }}</p>
    </div>
    {% endfor %}
  </div>
</section>

<style>
  .skills-groups {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 32px;
  }
  .skills-group h3 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  .skills-group p {
    font-size: 14px;
    line-height: 1.55;
    margin: 0;
    color: #778492;
  }
  @media (max-width: 767px) {
    .skills-groups { grid-template-columns: 1fr; }
  }
  @media print {
    .skills-groups { grid-template-columns: 1fr 1fr; gap: 10px 24px; }
  }
</style>
{% endif %}
